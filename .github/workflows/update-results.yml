name: Update World Cup Results

on:
  schedule:
    # Every 30 minutes during tournament hours (10 AM – midnight UTC)
    # Tournament: June 11 – July 19, 2026
    - cron: '0,30 10-23 11-19 6 *'   # June 11–19
    - cron: '0,30 10-23 * 7 *'        # All of July
  workflow_dispatch:

jobs:
  update-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install cheerio

      - name: Run results scraper
        run: node scrape-results.js | tee scraper-output.log

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet results.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to results.json"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "results.json has been updated"
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "World Cup Bot"
          git config user.email "bot@github-actions"
          git add results.json
          git commit -m "⚽ Update match results - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git fetch origin main
          git rebase --autostash origin/main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send update email
        if: steps.check_changes.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚽ World Cup Results Updated - $(date -u +'%Y-%m-%d %H:%M UTC')"
          to: ${{ secrets.EMAIL_TO }}
          from: World Cup Bot
          body: |
            World Cup match results have been updated.

            View the leaderboard: https://chrisalvey.github.io/worldcup

            Run: ${{ github.run_number }}
            Time: $(date -u +'%Y-%m-%d %H:%M UTC')

      - name: Send error email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ World Cup Scraper Failed - ${{ github.run_number }}"
          to: ${{ secrets.EMAIL_TO }}
          from: World Cup Bot
          body: |
            The World Cup results scraper failed.

            View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
